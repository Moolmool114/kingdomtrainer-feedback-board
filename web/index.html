<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122329">
<title>KingdomTrainer · 玩家反馈与进展</title>
<style>
:root{color-scheme:dark;--bg:#101d22;--panel:#172a30;--surface:#1c3239;--ink:#e7ece8;--muted:#91a5a5;--gold:#dcc690;--green:#83c3a9;--line:#2a4147;--red:#e39a85;font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}header{border-bottom:1px solid var(--line)}.top{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:23px 30px}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:650;letter-spacing:.04em}.crown{width:30px;height:26px;fill:var(--gold);shape-rendering:crispEdges}.small-link{font-size:13px;color:var(--muted)}.small-link:hover{color:var(--ink)}main{max-width:1160px;padding:54px 30px 72px;margin:auto}.eyebrow{margin:0 0 12px;font-size:11px;letter-spacing:.22em;color:var(--gold)}h1{font-size:clamp(27px,4vw,39px);line-height:1.3;font-weight:650;letter-spacing:-.035em;margin:0 0 13px}.intro{color:var(--muted);font-size:14px;margin:0}.hero{display:flex;justify-content:space-between;gap:30px;align-items:flex-end}.primary{display:inline-flex;gap:12px;align-items:center;justify-content:center;border:0;background:var(--gold);color:#1c2a29;padding:12px 20px;font-weight:650;font-size:14px}.primary:hover{background:#ead6a6}.stats{display:flex;gap:0;margin:35px 0 37px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0}.stat{display:flex;align-items:baseline;gap:12px;padding:0 32px;border-right:1px solid var(--line)}.stat:first-child{padding-left:0}.stat:last-child{border:0}.stat b{font-size:27px;font-weight:550;font-variant-numeric:tabular-nums;color:var(--gold)}.stat span{font-size:12px;color:var(--muted)}.controls{display:flex;align-items:center;gap:22px;justify-content:space-between;margin-bottom:24px}.tabs{display:flex;gap:23px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 0;font-size:14px}.tab[aria-pressed=true]{color:var(--gold);border-bottom-color:var(--gold)}.search{width:260px;max-width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 13px;font-size:13px}.legend{display:grid;grid-template-columns:105px 1fr 108px 80px;padding:0 20px 12px;font-size:11px;color:var(--muted)}.legend span:last-child{text-align:right}.issue{margin:0 0 12px;background:var(--panel)}summary{display:grid;grid-template-columns:105px 1fr 108px 80px;align-items:center;cursor:pointer;list-style:none;padding:22px 20px}summary::-webkit-details-marker{display:none}.type{font-size:11px;color:var(--muted)}.type b{display:block;font-weight:500;letter-spacing:.07em;font-size:10px;margin-bottom:4px}.type.problem{color:var(--red)}.type.suggestion{color:var(--green)}.issue-title{font-size:15px;line-height:1.55;padding-right:20px}.status{font-size:11px;display:inline-flex;align-items:center;gap:7px;color:var(--gold)}.status:before{content:"";width:5px;height:5px;background:currentColor;display:inline-block}.status.done{color:var(--green)}.status.neutral{color:var(--muted)}.count{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}.issue[open]{background:#1a2f35}.detail{margin:0 20px 0 125px;padding:0 0 23px;border-top:1px solid var(--line)}.detail p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:#c4d1cf;margin:17px 0}.reply{border-left:2px solid var(--gold);padding:1px 0 1px 15px;margin-top:20px}.reply .label{font-size:11px;color:var(--gold)}.reply p{margin:7px 0}.reply .empty{color:var(--muted)}.date{font-size:10px;color:var(--muted);margin-top:20px}.empty-state{padding:50px 20px;text-align:center;color:var(--muted);font-size:14px}.note{font-size:11px;color:var(--muted);margin-top:23px;display:flex;gap:12px;justify-content:space-between}.footer{max-width:1160px;margin:auto;padding:22px 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.admin-head{display:flex;gap:20px;justify-content:space-between;margin:26px 0 22px}.admin-head h2{margin:0;font-size:22px}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 13px;font-size:12px}.admin-grid{display:grid;grid-template-columns:minmax(220px,310px) 1fr;gap:20px}.admin-list{background:var(--panel);padding:8px;align-self:start;max-height:740px;overflow:auto}.admin-row{display:block;border:0;text-align:left;width:100%;background:transparent;color:var(--ink);padding:13px 12px;margin:0 0 4px;font-size:12px}.admin-row.active{background:var(--surface);box-shadow:inset 2px 0 var(--gold)}.admin-row small{display:block;color:var(--muted);margin-top:6px}.editor{background:var(--panel);padding:24px}.editor label{display:block;color:var(--muted);font-size:12px;margin:0 0 16px}.editor input,.editor textarea,.editor select{display:block;margin-top:7px;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 12px;font-size:13px}.editor textarea{resize:vertical;min-height:110px}.editor .row{display:flex;gap:16px}.editor .row label{flex:1}.editor .check{display:flex;gap:10px;align-items:center;color:var(--ink)}.editor .check input{width:auto;margin:0}.editor .actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.message{font-size:12px;color:var(--green)}.inbox{margin-top:30px}.inbox h3{font-size:16px}.inbox article{background:var(--panel);padding:18px 22px;margin-top:12px}.inbox h4{margin:0;font-size:13px;font-weight:550}.inbox small{font-size:11px;color:var(--muted)}.inbox p{font-size:12px;white-space:pre-wrap;color:#bbcdca;overflow-wrap:anywhere}.badge{color:var(--gold);font-size:11px;margin-left:12px}#alert{color:var(--red);font-size:13px;margin:20px 0}.loading{color:var(--muted);padding:20px;font-size:13px}.pager{display:flex;gap:14px;margin-top:18px;align-items:center;font-size:12px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:680px){.top{padding:18px 20px}.brand{font-size:13px}.hero{align-items:start;flex-direction:column;gap:20px}main{padding:32px 20px 50px}.primary{padding:11px 17px}.stats{margin:28px 0 25px;padding:17px 0}.stat{padding:0 17px;gap:8px}.stat b{font-size:23px}.stat span{font-size:11px}.controls{align-items:stretch;flex-direction:column;gap:12px}.search{width:100%}.legend{display:none}summary{grid-template-columns:75px 1fr;gap:10px 0;padding:17px}.issue-title{font-size:14px;padding-right:0}.type{grid-row:span 2}.status{grid-column:2;grid-row:2}.count{grid-column:2;grid-row:2;justify-self:end}.detail{margin:0 17px;padding-bottom:17px}.note{flex-direction:column;gap:4px}.footer{padding:20px;font-size:10px}.admin-grid{grid-template-columns:1fr}.admin-list{max-height:240px}.editor{padding:18px}.tabs{gap:23px}.admin-head{flex-wrap:wrap}.small-link{font-size:11px}}
</style></head><body>
<header><div class="top"><a class="brand" href="./"><svg class="crown" viewBox="0 0 30 26" aria-hidden="true"><path d="M2 5h5v5h5V2h6v8h5V5h5v17H2zm5 12v3h16v-3z"/></svg>KINGDOMTRAINER</a></div></header>
<main><section class="hero"><div><p class="eyebrow">PLAYER FEEDBACK / 玩家共建</p><h1>你的反馈，正在推进。</h1><p class="intro">问题、建议与后续进展，都在这里。</p></div></section>
<div id="alert" role="alert" hidden></div>
<section id="public"><div class="stats" aria-label="反馈统计"><div class="stat"><b id="total">—</b><span>已收录</span></div><div class="stat"><b id="progress">—</b><span>跟进中</span></div><div class="stat"><b id="done">—</b><span>已完成</span></div></div>
<div class="controls"><div class="tabs" role="group" aria-label="反馈分类"><button class="tab" data-filter="全部" aria-pressed="true">全部</button><button class="tab" data-filter="问题" aria-pressed="false">问题</button><button class="tab" data-filter="建议" aria-pressed="false">建议</button></div><input id="search" class="search" type="search" placeholder="搜索功能或问题…" aria-label="搜索功能或问题"></div>
<div class="legend" aria-hidden="true"><span>编号 / 类型</span><span>反馈事项</span><span>当前状态</span><span>相关反馈</span></div><div id="issues"><div class="loading">正在读取…</div></div><button id="more" class="secondary" hidden>加载更多</button>
<div class="note"><span>作者确认后公开 · 约每 30 分钟同步</span><span id="updated"></span></div></section>
</main><footer class="footer"><span>KingdomTrainer · 玩家反馈与进展</span><a href="https://kingdomtrainer-feedback.classybud9.chatgpt.site/admin">作者工作台 ↗</a></footer>
<script>
const $=s=>document.querySelector(s),make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
let all=[],filter='全部',overview=null,selected=null,nextCursor=null,issuePage=0,inboxPage=0;
function fail(text){$('#alert').hidden=false;$('#alert').textContent=text;}
function date(v){return new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeZone:'Asia/Shanghai'}).format(new Date(v));}
async function api(path,options){const r=await fetch(path,options);let v={};try{v=await r.json();}catch{}if(!r.ok){const error=new Error(v.error||'request_failed');error.status=r.status;throw error;}return v;}
function render(){const q=$('#search').value.trim().toLowerCase(),root=$('#issues');root.replaceChildren();const items=all.filter(i=>(filter==='全部'||i.kind===filter)&&(!q||(i.title+' '+i.summary+' '+i.reply).toLowerCase().includes(q)));for(const i of items){const d=make('details','issue'),s=make('summary');const type=make('span','type '+(i.kind==='问题'?'problem':'suggestion'));type.append(make('b','',i.number),document.createTextNode(i.kind));s.append(type,make('span','issue-title',i.title),make('span','status '+(/已修复|已完成/.test(i.status)?'done':i.status==='暂不采纳'?'neutral':''),i.status),make('span','count',String(i.reportCount)+' 条'));const detail=make('div','detail');detail.append(make('p','',i.summary));const reply=make('div','reply');reply.append(make('div','label','作者回复'),make('p',i.reply?'':'empty',i.reply||'待作者回复'));detail.append(reply,make('div','date','更新于 '+date(i.updatedAt)));d.append(s,detail);root.append(d);}if(!items.length)root.append(make('div','empty-state',all.length?'没有匹配的事项':'暂时没有已公开的事项'));}
async function loadPublic(more=false){try{const v=await api('./issues.json'+(more&&nextCursor?'?before='+nextCursor:''));all=more?all.concat(v.items):v.items;nextCursor=v.nextCursor;$('#more').hidden=!nextCursor;$('#total').textContent=v.stats.total;$('#progress').textContent=v.stats.progress;$('#done').textContent=v.stats.done;$('#updated').textContent='列表更新 '+date(v.updatedAt);render();}catch{fail('暂时无法读取清单，请稍后刷新。');if(!more)$('#issues').replaceChildren();}}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});$('#search').oninput=render;$('#more').onclick=()=>loadPublic(true);
loadPublic();
</script></body></html>
