name: Public feedback board
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/feedback-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: feedback-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - name: Deploy approved public feedback
        id: deployment
        uses: actions/deploy-pages@v4
